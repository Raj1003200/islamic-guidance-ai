<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Islamic Guidance AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="hero">
    <img src="logo.svg" alt="Islamic Guidance AI" class="logo" />
    <h1>Islamic Guidance AI</h1>
    <div class="search-wrapper">
      <input
        type="text"
        id="query"
        placeholder="Describe your situation... (e.g., 'I am feeling anxious about my future')"
        autocomplete="off"
      />
      <button id="searchBtn">Seek Guidance</button>
    </div>
    <a href="settings.html" class="settings-link">Settings</a>
    <div id="status" class="status hidden"></div>
    <div id="toast" class="toast hidden"></div>
  </section>
  <section id="result" class="result hidden">
    <div id="answer" class="answer"></div>
    <div id="citations" class="citations"></div>
  </section>
  <script src="script.js"></script>
</body>
</html>
