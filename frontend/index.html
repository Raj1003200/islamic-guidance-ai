<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Islamic Guidance AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Dark Mode Toggle -->
  <button id="darkModeToggle" class="dark-mode-toggle" aria-label="Toggle dark mode" title="Toggle Dark Mode">
    <span class="moon-icon">🌙</span>
    <span class="sun-icon hidden">☀️</span>
  </button>
  
  <section class="hero">
    <h1>Islamic Guidance AI</h1>
    
    <div class="search-container">
      <textarea
        id="query"
        rows="30"
        placeholder="Describe your situation in detail... (e.g., 'I am feeling sad and Anxious')"
        autocomplete="off"
      ></textarea>
      
      <!-- Dropdowns in one row -->
      <div class="options-row">
        <select id="source" class="source-select" aria-label="Select guidance source">
          <option value="both" selected>Both (AI + Sources)</option>
          <option value="internal">Internal (AI Only)</option>
          <option value="external">External (Sources Only)</option>
        </select>
        <select id="hadithCollection" class="hadith-collection-select" aria-label="Select Hadith collection">
          <option value="Sahihayn">Sahihayn (2 Books)</option>
          <option value="Forty_Collections">Forty Collections (3 Books)</option>
          <option value="Sunan_Arbaah">Sunan Arbaah (4 Books)</option>
          <option value="Kutub_al_Sittah">Kutub al-Sittah (6 Books)</option>
          <option value="Kutub_as_Sabiah">Kutub as-Sabiah (7 Books)</option>
        </select>
      </div>
      
      <!-- Control buttons in one row -->
      <div class="control-buttons-row">
        <button id="loadExampleBtn" class="secondary-btn">Load Example</button>
        <button id="settingsBtn" class="secondary-btn">Settings</button>
      </div>
      
      <!-- Main action button -->
      <button id="searchBtn" class="main-action-btn">SEEK GUIDANCE</button>
    </div>
    
    <div id="status" class="status hidden"></div>
    <div id="toast" class="toast hidden"></div>
    
    <section id="result" class="result hidden">
      <div id="answer" class="answer"></div>
      <div id="citations" class="citations"></div>
    </section>

    <!-- Credits Modal -->
    <div id="creditsModal" class="modal hidden">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2>Credits & Resources</h2>
        <div class="credits-links">
          <a href="https://github.com/fawazahmed0/hadith-api" target="_blank" rel="noopener noreferrer" class="credit-link">Hadith API</a>
          <a href="https://api.alquran.cloud/v1" target="_blank" rel="noopener noreferrer" class="credit-link">Al Quran Cloud</a>
          <a href="https://ai.google.dev/gemini-api/docs" target="_blank" rel="noopener noreferrer" class="credit-link">Gemini API</a>
        </div>
      </div>
    </div>
  </section>

  <div class="warning-banner">
    ⚠️ This is an AI-generated response. Manual cross-verification is required.
  </div>
  
  <script src="script.js"></script>
</body>
</html>
