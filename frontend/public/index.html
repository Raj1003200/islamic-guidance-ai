<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Guidance Search Engine</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="hero-section">
            <h1 class="title">Islamic Guidance Search</h1>
            <p class="subtitle">Find comfort and wisdom from the Quran and Hadith</p>
        </div>

        <div class="search-card">
            <form id="guidanceForm">
                <div class="form-group">
                    <label for="problem">What's troubling you?</label>
                    <textarea 
                        id="problem" 
                        name="problem" 
                        placeholder="e.g., I am feeling anxious about my future..."
                        rows="4"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="hadithBook">Select Hadith Collection</label>
                    <select id="hadithBook" name="hadithBook">
                        <option value="muslim">Sahih Muslim</option>
                        <option value="bukhari">Sahih Bukhari</option>
                        <option value="abudawud">Sunan Abu Dawud</option>
                        <option value="ibnmajah">Sunan Ibn Majah</option>
                        <option value="tirmidhi">Jami' at-Tirmidhi</option>
                        <option value="nasai">Sunan an-Nasa'i</option>
                        <option value="malik">Muwatta Malik</option>
                        <option value="nawawi">40 Hadith Nawawi</option>
                        <option value="qudsi">Hadith Qudsi</option>
                        <option value="dehlawi">Musnad Dehlawi</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Search for Guidance</span>
                    <span class="loader" style="display: none;"></span>
                </button>
            </form>

            <div id="error" class="error-message" style="display: none;"></div>
        </div>

        <div id="results" class="results-section" style="display: none;">
            <h2 class="results-title">Your Guidance</h2>
            
            <div class="advice-card">
                <h3>Compassionate Advice</h3>
                <div id="adviceContent" class="content"></div>
            </div>

            <div class="sources-grid">
                <div class="source-card">
                    <h3>Quran Verses</h3>
                    <div id="quranContent" class="content"></div>
                </div>

                <div class="source-card">
                    <h3>Hadith</h3>
                    <div id="hadithContent" class="content"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
